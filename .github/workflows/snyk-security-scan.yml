name: Snyk Container Pipeline Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull your repository code onto the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build the Docker container using your local directory setup
      - name: Build Local Docker Image
        run: |
          docker build -t local-test-image:latest ./SQLi/sqli-login.js/

      # Step 3: Run the correct Snyk container scanner path
      - name: Run Snyk Container Scan
        uses: snyk/actions/container@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: local-test-image:latest
          args: --file=./SQLi/sqli-login.js/Dockerfile --severity-threshold=high
